apiVersion: v1
kind: Pod
metadata:
  name: istio-test
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: istio-test
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  restartPolicy: Never

  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: istio-test
      image: curlimages/curl:8.12.1
      command:
        - sleep
        - "3600"

      securityContext:
        runAsNonRoot: true
        runAsUser: 10007
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
