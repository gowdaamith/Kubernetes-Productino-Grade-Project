apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-worker
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: order-worker
    app.kubernetes.io/part-of: ecommerce-platform

spec:
  replicas: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: order-worker

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-worker
        app.kubernetes.io/part-of: ecommerce-platform

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: order-worker
          image: order-worker:v1
          imagePullPolicy: IfNotPresent

          env:
            - name: RABBITMQ_HOST
              value: rabbitmq.rabbitmq.svc.cluster.local

            - name: RABBITMQ_PORT
              value: "5672"

            - name: RABBITMQ_QUEUE
              value: order-events

            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: order-worker-rabbitmq-auth
                  key: rabbitmq-username

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-worker-rabbitmq-auth
                  key: rabbitmq-password

            - name: PROCESSING_SECONDS
              value: "5"

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
