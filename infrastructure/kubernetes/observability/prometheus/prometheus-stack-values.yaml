
alertmanager:
  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: slack-notifications
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: slack-notifications
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/slack_api_url
            channel: "#kubernetes-alerts"
            send_resolved: true
            title: '{{ template "slack.default.title" . }}'
            text: '{{ template "slack.default.text" . }}'

      - name: "null"
  alertmanagerSpec:
    secrets:
      - slack-webhook
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: standard
  enabled: true

coreDns:
  enabled: true

defaultRules:
  create: true

grafana:
  defaultDashboardsEnabled: true
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard
    type: pvc
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 50m
      memory: 128Mi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true

kubeApiServer:
  enabled: true

kubeControllerManager:
  enabled: true

kubeEtcd:
  enabled: true

kubeProxy:
  enabled: true

kubeScheduler:
  enabled: true

kubeStateMetrics:
  enabled: true

kubelet:
  enabled: true

nodeExporter:
  enabled: true

prometheus:
  enabled: true
  prometheusSpec:
    evaluationInterval: 30s
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    replicas: 1
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 200Mi
    retention: 15d
    ruleNamespaceSelector: {}
    ruleSelector: {}
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
          storageClassName: standard

prometheusOperator:
  enabled: true

