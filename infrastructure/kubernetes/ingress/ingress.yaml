apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: ecommerce-ui
  namespace: ecommerce
  labels: 
    app.kubernetes.io/name: ecommerce-ui
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  ingressClassName: nginx
  rules:
    - host: ecommerce.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: 
              service:
                name: ecommerce-ui
                port:
                  number: 80
