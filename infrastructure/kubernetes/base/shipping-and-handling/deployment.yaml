apiVersion: apps/v1
kind: Deployment

metadata:
  name: shipping-and-handling
  namespace: ecommerce

  labels:
    app.kubernetes.io/name: shipping-and-handling
    app.kubernetes.io/part-of: ecommerce-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-and-handling

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping-and-handling
        app.kubernetes.io/part-of: ecommerce-platform

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway

          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shipping-and-handling

      securityContext:
        runAsNonRoot: true
        runAsUser: 10004
        runAsGroup: 10004

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: shipping-and-handling
          image: shipping-and-handling:v2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: shipping-and-handling-config
          env:
            - name: INITIALIZE_SAMPLE_DATA
              value: "false"


          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 128Mi

          startupProbe:
            httpGet:
              path: /health/live
              port: http

            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health/live
              port: http

            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http

            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
