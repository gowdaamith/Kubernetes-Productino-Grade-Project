apiVersion: v1
kind: Service

metadata:
  name: ecommerce-ui
  namespace: ecommerce

  labels:
    app.kubernetes.io/name: ecommerce-ui
    app.kubernetes.io/part-of: ecommerce-platform

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: ecommerce-ui

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
