apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-management
  namespace: ecommerce

  labels:
    app.kubernetes.io/name: order-management
    app.kubernetes.io/part-of: ecommerce-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: order-management

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-management
        app.kubernetes.io/part-of: ecommerce-platform

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10006
        runAsGroup: 10006

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: order-management

          image: order-management:v3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9090
              protocol: TCP

          envFrom:
            - configMapRef:
                name: order-management-config

          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: order-worker-rabbitmq-auth
                  key: rabbitmq-username

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-worker-rabbitmq-auth
                  key: rabbitmq-password

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: tmp
          emptyDir: {}
