auth:
  username: ecommerce-worker
  existingPasswordSecret: rabbitmq-auth
  existingSecretPasswordKey: rabbitmq-password
  securePassword: false

replicaCount: 1

persistence:
  enabled: true
  storageClass: standard
  size: 1Gi

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi

clustering:
  enabled: false

metrics:
  enabled: false

global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/rabbitmq
  tag: 4.1.3-debian-12-r1
  pullPolicy: IfNotPresent
