
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 168h

  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard
    enableStatefulSetAutoDeletePVC: false

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

gateway:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

test:
  enabled: false

lokiCanary:
  enabled: false

