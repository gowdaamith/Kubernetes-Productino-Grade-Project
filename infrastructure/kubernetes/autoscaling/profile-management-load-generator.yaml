apiVersion: v1
kind: Pod

metadata:
  name: profile-management-load-generator
  namespace: ecommerce

  labels:
    app.kubernetes.io/name: profile-management-load-generator
    app.kubernetes.io/part-of: ecommerce-platform

spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: load-generator
      image: busybox:1.36
      imagePullPolicy: IfNotPresent

      command:
        - /bin/sh
        - -c
        - |
          echo "Starting concurrent HTTP load generation..."

          for worker in $(seq 1 20); do
            (
              while true; do
                wget -q -O /dev/null \
                  http://profile-management:3003/health/live
              done
            ) &
          done

          wait

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 100m
          memory: 32Mi

        limits:
          cpu: 500m
          memory: 128Mi
