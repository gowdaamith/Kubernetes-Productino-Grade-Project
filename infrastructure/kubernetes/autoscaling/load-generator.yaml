apiVersion: v1
kind: Pod

metadata:
  name: load-generator
  namespace: ecommerce

spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: load-generator
      image: busybox:1.36

      command:
        - /bin/sh
        - -c

      args:
        - |
          while true; do
            if wget -q -O /dev/null http://product-catalog:3001/api/products; then
              echo "Request successful"
            else
              echo "Request failed"
            fi
          done
      resources:
        requests:
          cpu: 50m
          memory: 32Mi

        limits:
          cpu: 200m
          memory: 64Mi

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
