apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: profile-mysql
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: profile-mysql
    app.kubernetes.io/part-of: ecommerce-platform

spec:
  serviceName: profile-mysql
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: profile-mysql

  template:
    metadata:
      labels:
        app.kubernetes.io/name: profile-mysql
        app.kubernetes.io/part-of: ecommerce-platform

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999

            seccompProfile:
              type: RuntimeDefault

          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP

          
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: profile-mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: profile-mysql-secret
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: profile-mysql-secret
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: profile-mysql-secret
                  key: MYSQL_PASSWORD

            - name: MYSQL_ROOT_HOST
              value: "localhost"

          
          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: "1"
              memory: 1Gi

          
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"'

            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5


          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"'

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"'

            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: profile-mysql-pvc
