apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: profile-mysql-pvc
  namespace: ecommerce
  labels: 
    app.kubernetes.io/name: profile-management
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  accessModes: 
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests: 
      storage: 2Gi


