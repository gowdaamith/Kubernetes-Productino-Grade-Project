apiVersion: v1
kind: Service
metadata: 
  name: mongodb
  namespace: ecommerce
  labels: 
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: ecommerce-platform

spec: 
  type: ClusterIP
  selector: 
    app.kubernetes.io/name: mongodb
  ports: 
    - name: mongodb
      port: 27017
      targetPort: mongodb
      protocol: TCP

