apiVersion: batch/v1
kind: Job

metadata:
  name: inventory-db-init
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: inventory-db-init
    app.kubernetes.io/part-of: ecommerce-platform

spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300

  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-db-init
        app.kubernetes.io/part-of: ecommerce-platform

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c
            - |
              until pg_isready \
                -h inventory-postgres \
                -p 5432 \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB"; do
                echo "Waiting for PostgreSQL..."
                sleep 3
              done

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: inventory-postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: inventory-postgres-secret
                  key: POSTGRES_USER

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      containers:
        - name: initialize-database
          image: product-inventory:v2
          imagePullPolicy: IfNotPresent

          command:
            - python
            - init_db.py

          env:
            - name: POSTGRES_HOST
              value: inventory-postgres

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: inventory-postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: inventory-postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-postgres-secret
                  key: POSTGRES_PASSWORD

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
