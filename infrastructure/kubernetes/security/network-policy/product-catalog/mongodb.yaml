apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: 
  name: mongodb-ingress
  namespace: ecommerce
spec:
  podSelector: 
    matchLabels: 
      app.kubernetes.io/names: mongodb
  policyTypes: 
    - Ingress
  ingress:
    - from: 
        - podSelector: 
            matchLabels: 
              app.kubernetes.io/name: product-catalog
      ports: 
        - protocol: TCP
          port: 27017
    - from:   
        - podSelector:
            matchLabels: 
              app.kubernetes.io/name: shipping-and-handling-init
      ports:
        - protocol: TCP
          port: 27017
    - from:
        - podSelector: 
            matchLabels: 
              app.kubernetes.io/name: shipping-and-handling
    - from: 
        - podSelector: 
            matchLabels: 
              app.kubernetes.io/name: contact-support-team
      ports:
        - protocol: TCP
          port: 27017

    - from:
        - podSelector:
            matchLabels: 
              app.kubernetes.io/name: order-management

      ports: 
        - protocol: TCP
          port: 27017


