apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: 
  name: order-management
  namespace: ecommerce
  labels: 
    app.kubernetes.io/name: order-management
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  podSelector: 
    matchLabels: 
      app.kubernetes.io/name: order-management
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector: 
            matchLabels: 
              app.kubernetes.io/part-of: ecommerce-platform
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to: 
        - podSelector: 
            matchLabels: 
              app.kubernetes.io/name: product-catalog
      ports:
        - protocol: TCP
          port: 3001
    - to: 
        - podSelector: 
            matchLabels: 
              app.kubernetes.io/name: product-inventory
      ports:
        - protocol: TCP
          port: 3002
    - to: 
        - podSelector: 
            matchLabels: 
              app.kubernetes.io/name: shipping-and-handling
      ports: 
        - protocol: TCP
          port: 8080
    - to: 
        - podSelector: 
            matchLabels: 
              app.kubernetes.io/name: mongodb
      ports:
        - protocol: TCP
          port: 27017
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53


