apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: ecommerce-ui-strict-mtls
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ecommerce-ui
  mtls:
    mode: STRICT
