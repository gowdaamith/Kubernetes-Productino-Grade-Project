apiVersion: networking.istio.io/v1
kind: Gateway
metadata: 
  name: ecommerce-gateway
  namespace: ecommerce
  labels: 
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  selector: 
    istio: ingressgateway
  servers:
    - port: 
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - ecommerce.local

