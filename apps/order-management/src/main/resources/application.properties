# =========================================================
# Application Configuration
# =========================================================
spring.application.name=order-management

# =========================================================
# Server Configuration
# =========================================================
server.port=${SERVER_PORT:9090}
server.address=0.0.0.0

# =========================================================
# Product Inventory Microservice
# Local development: http://localhost:3002
# Kubernetes: http://product-inventory:3002
# =========================================================
product.inventory.api.host=${PRODUCT_INVENTORY_API_HOST:http://localhost:3002}

# =========================================================
# Product Catalog Microservice
# Local development: http://localhost:3001
# Kubernetes: http://product-catalog:3001
# =========================================================
product.catalog.api.host=${PRODUCT_CATALOG_API_HOST:http://localhost:3001}

# =========================================================
# Shipping and Handling Microservice
# Local development: http://localhost:8080
# Kubernetes: http://shipping-and-handling:8080
# =========================================================
shipping.handling.api.host=${SHIPPING_HANDLING_API_HOST:http://localhost:8080}

# =========================================================
# MongoDB Configuration
# =========================================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/orders_db}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:orders_db}

# =========================================================
# Spring Boot Actuator Health Endpoints
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# =========================================================
# Graceful Shutdown
# =========================================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s



spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq.rabbitmq.svc.cluster.local}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Request publisher confirmations from RabbitMQ.
spring.rabbitmq.publisher-confirm-type=correlated

# Detect messages that the broker cannot route.
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Order event publisher settings.
app.order-events.queue=${ORDER_EVENTS_QUEUE:order-events}
app.order-events.publisher-delay-ms=${ORDER_EVENTS_PUBLISHER_DELAY_MS:2000}
